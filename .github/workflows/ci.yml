name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-saas-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            rag-saas-backend/requirements.txt
            rag-saas-backend/requirements-test.txt
            rag-saas-backend/evaluation/requirements.txt
      # CPU-only torch keeps the install small; the tests never use a GPU.
      - name: Install dependencies
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest tests -q -p no:cacheprovider

  models:
    # Real HuggingFace models end to end; Groq runs only if the TEST_GROQ_API_KEY secret exists.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-saas-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            rag-saas-backend/requirements.txt
            rag-saas-backend/requirements-test.txt
            rag-saas-backend/evaluation/requirements.txt
      - name: Install dependencies
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt
      - name: Download models (tests then run offline)
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          for repo, revision in [
              ("sentence-transformers/all-MiniLM-L6-v2", None),
              ("sentence-transformers/all-MiniLM-L6-v2", "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"),
              ("cross-encoder/ms-marco-MiniLM-L-6-v2", None),
              ("cross-encoder/ms-marco-MiniLM-L-6-v2", "233902d25c440f23af6f7d6e94d2946bac0bee0a"),
          ]:
              snapshot_download(repo, revision=revision)
          PY
      - name: Run real-model tests
        env:
          TEST_GROQ_API_KEY: ${{ secrets.TEST_GROQ_API_KEY }}
        run: python -m pytest tests -q -p no:cacheprovider -m "models or live" --run-models --run-live -rP

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-saas-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: rag-saas-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach
      - name: Smoke test (no Groq key needed)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          curl -fsS -o /dev/null http://localhost:5173/
          curl -fsS -o /dev/null http://localhost:8000/docs
          # Upload, list and delete a real PDF: exercises embeddings and the Qdrant server.
          pdf=rag-saas-backend/evaluation/corpora/synthetic_stations_v1/raglens_runtime_20260831_aurora.pdf
          curl -fsS -F "file=@${pdf}" http://localhost:8000/documents/upload
          curl -fsS http://localhost:8000/documents | grep -q raglens_runtime_20260831_aurora.pdf
          curl -fsS -X DELETE http://localhost:8000/documents/raglens_runtime_20260831_aurora.pdf
          test "$(curl -fsS http://localhost:8000/documents)" = '{"documents":[]}'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
